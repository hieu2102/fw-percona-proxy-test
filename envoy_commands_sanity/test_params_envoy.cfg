# Kubernetes namespace of the Redis cluster under test
TENANT_NAME="<k8s-namespace>"
# Pod used to run redis-cli against the proxy
POD_NAME="<redis-pod-name>"
# Kubernetes Service fronting the Envoy proxy (its external-dns hostname is used as PROXY_HOST)
PROXY_SERVICE="<proxy-service-name>"
PROXY_PORT=<proxy-port>
REDIS_PWD="<redis-password>"
